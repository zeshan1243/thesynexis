<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Synexis">
  <defs>
    <linearGradient id="synexis-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square outline -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#synexis-grad)" stroke-width="3"/>
  <!-- T on top -->
  <line x1="18" y1="16" x2="46" y2="16" stroke="url(#synexis-grad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="32" y2="32" stroke="url(#synexis-grad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- S connected from T stem center -->
  <path d="M40 32 H24 C17 32 17 41 24 41 H40 C47 41 47 50 40 50 H22"
        fill="none" stroke="url(#synexis-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
